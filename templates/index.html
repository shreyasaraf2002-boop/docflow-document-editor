<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocFlow | Your document workspace</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="brand"><span class="logo">D</span><span>DocFlow</span><span class="subtitle">Workspace</span></div><div class="header-right"><span class="user-label">Viewing as</span><select id="user"><option value="1">Alex</option><option value="2">Sam</option></select></div></header>
<div class="layout"><aside><button class="primary" id="new">＋ New document</button><label class="upload">⇧ Import .txt or .md<input id="file" type="file" accept=".txt,.md" hidden></label><div class="label">DOCUMENTS</div><div id="documents"></div><div class="aside-foot">Switch between Alex and Sam to test sharing.<br><small>Demo accounts; not secure authentication.</small></div></aside>
<main><div id="empty" class="empty"><div class="empty-icon">▤</div><h1>Your ideas belong here.</h1><p>Create a document or import a text file to get started.</p><button class="primary" id="empty-new">Create your first document</button></div>
<div id="workspace" hidden><div class="editor-header"><div><input aria-label="Document title" id="title" placeholder="Untitled Document"><div id="status">All changes saved</div></div><div class="actions"><button id="save">Save</button><button class="primary" id="share">Share ↗</button></div></div><div class="toolbar" id="toolbar"><button data-cmd="bold" title="Bold"><b>B</b></button><button data-cmd="italic" title="Italic"><i>I</i></button><button data-cmd="underline" title="Underline"><u>U</u></button><span class="separator"></span><button data-cmd="formatBlock" data-val="h2" title="Heading">H2</button><button data-cmd="formatBlock" data-val="p" title="Paragraph">¶</button><span class="separator"></span><button data-cmd="insertUnorderedList" title="Bulleted list">☷</button><button data-cmd="insertOrderedList" title="Numbered list">1.</button></div><div class="paper-wrap"><div id="editor" class="paper" contenteditable="true" aria-label="Document editor" data-placeholder="Start writing something great..."></div></div></div>
</main></div><div class="toast" id="toast" role="status" hidden></div><dialog id="share-dialog"><div class="dialog-body"><h2>Share document</h2><p>Choose who can view and edit this document.</p><select id="recipient"></select><div class="dialog-actions"><button id="cancel-share">Cancel</button><button class="primary" id="confirm-share">Share document</button></div></div></dialog><script src="/static/app.js"></script></body></html>
